services:
  proxyweave:
    image: ghcr.io/amberpepper/proxyweave:latest
    container_name: proxyweave
    restart: unless-stopped
    # 方式一：使用主机网络模式（推荐，支持端口自动重分配）
    network_mode: host
    # 方式二：手动映射端口（注释掉 network_mode，启用下面的 ports）
    # ports:
    #   - "2323:2323"
    #   - "9091:9091"
    #   - "24000-24200:24000-24200"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
