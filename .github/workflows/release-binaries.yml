name: Release Binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  GO_VERSION: '1.24.4'
  BINARY_NAME: proxyweave
  BUILD_TAGS: with_utls with_quic with_grpc with_wireguard with_gvisor with_clash_api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests
        run: go test ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            archive: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then
            ext=".exe"
          fi
          mkdir -p build/${GOOS}/${GOARCH}
          go build \
            -trimpath \
            -tags "${BUILD_TAGS}" \
            -o "build/${GOOS}/${GOARCH}/${BINARY_NAME}${ext}" \
            ./cmd/proxyweave

      - name: Package archive
        run: |
          version="${GITHUB_REF_NAME:-dev}"
          asset="${BINARY_NAME}_${version}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cd build/${{ matrix.goos }}/${{ matrix.goarch }}
            zip -9 "../../../dist/${asset}.zip" "${BINARY_NAME}.exe"
          else
            tar -C build/${{ matrix.goos }}/${{ matrix.goarch }} -czf "dist/${asset}.tar.gz" "${BINARY_NAME}"
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
